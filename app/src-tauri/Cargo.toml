# Butler's desktop shell (docs/desktop-app.md D2/D3). app/AGENTS.md is the
# local contract. Decision logic lives in src/logic.rs and is what
# `cargo test` covers; test/test_app_rust.py runs it from pytest.
[package]
name = "butler-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "butler"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# 2.12 or later: the startup and permission fixes landed there (DA-17).
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "~2.4"
tauri-plugin-autostart = "~2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SAME versions wry 0.57 uses, so the controller Tauri hands over is
# the type these bindings call (the microphone gate, src/guard.rs).
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
