[pytest]
testpaths = test

# test/manual holds the spike's standalone scripts. They are named test_*.py
# but they are not pytest tests -- pytest runs their module bodies, which
# reach for a WAV that does not exist on this machine. See test/manual/README.
norecursedirs = manual .venv node_modules .git
asyncio_mode = strict
# strict, not auto: every async test carries @pytest.mark.asyncio explicitly.
# Under auto mode a test that loses its mark still runs, and a test that
# silently stops running is an instrument that lies about the code (D-13).

asyncio_default_fixture_loop_scope = function

# Fail on an unregistered mark rather than treating the typo as a no-op.
addopts = --strict-markers -ra
markers =
    slow: takes more than a few seconds (soak, bench, real model load)
    needs_audio: requires the generated WAV fixtures in test/assets
    needs_gpu: loads a real model onto the 1080 Ti
